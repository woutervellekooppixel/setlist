<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Setlist</title>
  </head>
  <body>
    <sp-theme theme="spectrum" scale="medium" color="dark">
      <div class="wrap">
        <div class="hero" aria-hidden="true">
          <span class="heroLogo">
            <img
              src="icons/logo.png"
              alt=""
            />
          </span>
        </div>

        <div class="card">
          <sp-label>Crop width (X, px)</sp-label>
          <sp-textfield
            id="sliceWidth"
            type="number"
            min="1"
            step="1"
            placeholder="1080"
          ></sp-textfield>
        </div>

        <div class="card">
          <sp-label>Number of crops</sp-label>
          <sp-textfield id="count" type="number" min="1" step="1"></sp-textfield>
        </div>

        <div class="card">
          <sp-label>Destination</sp-label>
          <sp-button id="chooseFolder" variant="secondary" class="fullWidth">
            Browse
          </sp-button>
        </div>

        <div class="card">
          <sp-button id="run" variant="cta" class="cta fullWidth">Export</sp-button>
        </div>

        <sp-divider size="s"></sp-divider>
        <sp-detail id="status" size="S"></sp-detail>

        <sp-detail class="footer" size="S">© wouter.photo</sp-detail>
      </div>
    </sp-theme>

    <script src="main.js"></script>
  </body>
</html>
